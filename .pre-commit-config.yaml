# Git hooks for z3dsw, managed by pre-commit (https://pre-commit.com).
#
#   Install:     scripts/bootstrap.sh
#                (or manually: pip install pre-commit && pre-commit install)
#   Run all:     pre-commit run --all-files
#   Update revs: pre-commit autoupdate
#
# The commit-msg hook enforces "<Prefix>: <subject>" (see scripts/commit_msg.py
# and .gitmessage). File hooks keep formatting, whitespace and files consistent.
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: detect-private-key

  - repo: local
    hooks:
      # Uses the clang-format on PATH (>= 19 is required by .clang-format).
      - id: clang-format
        name: clang-format
        description: Format C/C++ sources using .clang-format
        entry: clang-format -i --style=file
        language: system
        types_or: [c, c++]

      # Runs the project version of cmake-format in an isolated env.
      - id: cmake-format
        name: cmake-format
        description: Format CMake files using .cmake-format.py
        entry: cmake-format -i
        language: python
        additional_dependencies: [cmake-format]
        files: (^|/)CMakeLists\.txt$|\.cmake$

      - id: commit-msg
        name: commit message format
        description: 'Enforce "<Prefix>: <subject>" with a <= 72 column header'
        entry: python3 scripts/commit_msg.py
        language: system
        stages: [commit-msg]
